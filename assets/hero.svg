<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">BetterStatus</title>
  <desc id="desc">Switch Discord statuses instantly with polished presets and global hotkeys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1020"/>
      <stop offset=".52" stop-color="#17152d"/>
      <stop offset="1" stop-color="#21153a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8ba4ff"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".36"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="260" fill="url(#glow)"/>
  <circle cx="110" cy="410" r="220" fill="url(#glow)" opacity=".45"/>
  <path d="M890 0h310v260c-70-20-122-64-155-132C1014 66 963 23 890 0Z" fill="#5865f2" opacity=".07"/>
  <g transform="translate(72 72)">
    <rect width="74" height="74" rx="22" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="37" y="48" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="800">BS</text>
    <text x="0" y="132" fill="white" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="800" letter-spacing="-2">BetterStatus</text>
    <text x="0" y="177" fill="#c8c9d8" font-family="Inter,Segoe UI,sans-serif" font-size="23">Your Discord presence. One shortcut away.</text>
    <g transform="translate(0 216)" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="650">
      <rect width="145" height="38" rx="19" fill="#5865f2" fill-opacity=".16" stroke="#7583ff" stroke-opacity=".45"/>
      <text x="72" y="25" text-anchor="middle" fill="#b9c2ff">GLOBAL HOTKEYS</text>
      <rect x="157" width="152" height="38" rx="19" fill="#a855f7" fill-opacity=".12" stroke="#c084fc" stroke-opacity=".38"/>
      <text x="233" y="25" text-anchor="middle" fill="#ddbcff">MEMORY PRESETS</text>
      <rect x="321" width="140" height="38" rx="19" fill="#22c55e" fill-opacity=".11" stroke="#4ade80" stroke-opacity=".34"/>
      <text x="391" y="25" text-anchor="middle" fill="#8ceaaa">AUTO UPDATES</text>
    </g>
  </g>
  <g transform="translate(705 70)" filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g>
      <rect width="410" height="120" rx="18" fill="#171522" stroke="#ef4d5d" stroke-opacity=".55"/>
      <rect width="5" height="120" rx="3" fill="#ef4d5d"/>
      <circle cx="42" cy="43" r="8" fill="#ef4d5d"/>
      <text x="66" y="49" fill="white" font-size="22" font-weight="700">Deep focus</text>
      <text x="332" y="48" fill="#f8a9b0" font-size="13" font-weight="700">DND</text>
      <text x="42" y="83" fill="#a8a6b5" font-size="16">Locked in. No distractions.</text>
      <rect x="286" y="70" width="90" height="28" rx="7" fill="#252333"/>
      <text x="331" y="89" text-anchor="middle" fill="#c9c7d3" font-size="13">⌘ + Shift + 1</text>
    </g>
    <g transform="translate(0 142)">
      <rect width="410" height="120" rx="18" fill="#171522" stroke="#43b581" stroke-opacity=".55"/>
      <rect width="5" height="120" rx="3" fill="#43b581"/>
      <circle cx="42" cy="43" r="8" fill="#43b581"/>
      <text x="66" y="49" fill="white" font-size="22" font-weight="700">Available</text>
      <text x="315" y="48" fill="#86ddb4" font-size="13" font-weight="700">ONLINE</text>
      <text x="42" y="83" fill="#a8a6b5" font-size="16">Free to chat — say hello.</text>
      <rect x="286" y="70" width="90" height="28" rx="7" fill="#252333"/>
      <text x="331" y="89" text-anchor="middle" fill="#c9c7d3" font-size="13">⌘ + Shift + 2</text>
    </g>
  </g>
  <text x="72" y="384" fill="#77758a" font-family="Inter,Segoe UI,sans-serif" font-size="14">A polished Vencord user plugin for Discord Desktop and Vesktop</text>
</svg>
