name: Build rolling release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  build-macos-cli:
    name: Build headless macOS installer
    runs-on: macos-latest

    steps:
      - name: Check out official Vencord Installer source
        uses: actions/checkout@v4
        with:
          repository: Vencord/Installer

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI for Intel and Apple Silicon
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -o vencord-installer-cli-macos-x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -o vencord-installer-cli-macos-arm64 .

      - name: Upload macOS CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: vencord-installer-cli-macos
          path: vencord-installer-cli-macos-*

  compatibility-test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out StatusHotkeys
        uses: actions/checkout@v4
        with:
          path: statusHotkeys

      - name: Check out Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: Vencord

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Add plugin to Vencord
        run: |
          mkdir -p Vencord/src/userplugins/statusHotkeys
          cp statusHotkeys/index.tsx statusHotkeys/Settings.tsx statusHotkeys/native.ts statusHotkeys/types.ts Vencord/src/userplugins/statusHotkeys/

      - name: Install dependencies and build
        working-directory: Vencord
        env:
          # Also exercise the metadata fallback used by archive-based installs.
          VENCORD_HASH: archive
          VENCORD_REMOTE: Vendicated/Vencord
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  release:
    needs:
      - compatibility-test
      - build-macos-cli
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin source
        run: |
          test -f index.tsx
          test -f Settings.tsx
          test -f native.ts
          test -f types.ts
          bash -n install.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Download headless macOS installer binaries
        uses: actions/download-artifact@v4
        with:
          name: vencord-installer-cli-macos
          path: macos-cli

      - name: Create release packages
        run: |
          mkdir -p package
          cp index.tsx Settings.tsx native.ts types.ts README.md package/
          tar -C package -czf status-hotkeys.tar.gz .
          (cd package && zip -qr ../status-hotkeys.zip .)
          cp macos-cli/vencord-installer-cli-macos-* .
          chmod +x vencord-installer-cli-macos-*
          sha256sum status-hotkeys.tar.gz status-hotkeys.zip vencord-installer-cli-macos-* > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: status-hotkeys-${{ github.sha }}
          path: |
            status-hotkeys.tar.gz
            status-hotkeys.zip
            SHA256SUMS.txt
            install.sh
            install.ps1
            vencord-installer-cli-macos-*

      - name: Replace rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            status-hotkeys.tar.gz \
            status-hotkeys.zip \
            SHA256SUMS.txt \
            install.sh \
            install.ps1 \
            vencord-installer-cli-macos-x64 \
            vencord-installer-cli-macos-arm64 \
            --target "$GITHUB_SHA" \
            --title "Latest StatusHotkeys build" \
            --notes "Automated build from commit $GITHUB_SHA. This rolling release is replaced after every push to main." \
            --latest
