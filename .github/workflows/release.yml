name: Build update channels

on:
  push:
    branches:
      - prod
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    name: Test sync server
    runs-on: ubuntu-latest
    steps:
      - name: Check out BetterStatus
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test server
        working-directory: server
        run: go test ./...

  build-macos-cli:
    if: github.ref_name == 'prod'
    name: Build headless macOS installer
    runs-on: macos-latest

    steps:
      - name: Check out BetterStatus
        uses: actions/checkout@v4
        with:
          path: betterStatus

      - name: Check out official Vencord Installer source
        uses: actions/checkout@v4
        with:
          repository: Vencord/Installer
          path: Installer

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Installer/go.mod

      - name: Build CLI for Intel and Apple Silicon
        working-directory: Installer
        run: |
          cp ../betterStatus/scripts/vencord_cli_darwin_compat.go .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags cli -o ../vencord-installer-cli-macos-x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags cli -o ../vencord-installer-cli-macos-arm64 .

      - name: Upload macOS CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: vencord-installer-cli-macos
          path: vencord-installer-cli-macos-*

  compatibility-test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out BetterStatus
        uses: actions/checkout@v4
        with:
          path: betterStatus

      - name: Check out Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: Vencord

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Add plugin to Vencord
        run: |
          mkdir -p Vencord/src/userplugins/betterStatus
          cp betterStatus/src/index.tsx betterStatus/src/Settings.tsx betterStatus/src/StatusHistory.tsx betterStatus/src/StatusSwitcher.tsx betterStatus/src/savedStatuses.ts betterStatus/src/native.ts betterStatus/src/types.ts betterStatus/src/styles.css Vencord/src/userplugins/betterStatus/

      - name: Install dependencies and build
        working-directory: Vencord
        env:
          # Also exercise the metadata fallback used by archive-based installs.
          VENCORD_HASH: archive
          VENCORD_REMOTE: Vendicated/Vencord
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  publish-manifest:
    if: github.ref_name == 'dev'
    name: Publish file manifest
    needs:
      - compatibility-test
      - server-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out channel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Generate files.json
        run: node scripts/generate-files-manifest.mjs "$GITHUB_SHA"

      - name: Commit channel manifest
        run: |
          git add files.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dev file manifest [skip ci]"
          git push origin "HEAD:dev"

  release:
    if: github.ref_name == 'prod'
    needs:
      - compatibility-test
      - build-macos-cli
      - server-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin source
        run: |
          test -f src/index.tsx
          test -f src/Settings.tsx
          test -f src/StatusHistory.tsx
          test -f src/StatusSwitcher.tsx
          test -f src/savedStatuses.ts
          test -f src/native.ts
          test -f src/types.ts
          test -f src/styles.css
          bash -n install.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) > $null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Download headless macOS installer binaries
        uses: actions/download-artifact@v4
        with:
          name: vencord-installer-cli-macos
          path: macos-cli

      - name: Create release packages
        run: |
          mkdir -p package
          cp src/index.tsx src/Settings.tsx src/StatusHistory.tsx src/StatusSwitcher.tsx src/savedStatuses.ts src/native.ts src/types.ts src/styles.css README.md package/
          printf 'prod:%s\n' "$GITHUB_SHA" > package/VERSION
          tar -C package -czf better-status.tar.gz .
          (cd package && zip -qr ../better-status.zip .)
          cp macos-cli/vencord-installer-cli-macos-* .
          chmod +x vencord-installer-cli-macos-*
          sha256sum better-status.tar.gz better-status.zip vencord-installer-cli-macos-* > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: better-status-${{ github.sha }}
          path: |
            better-status.tar.gz
            better-status.zip
            SHA256SUMS.txt
            install.sh
            install.ps1
            vencord-installer-cli-macos-*

      - name: Replace rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            better-status.tar.gz \
            better-status.zip \
            SHA256SUMS.txt \
            install.sh \
            install.ps1 \
            vencord-installer-cli-macos-x64 \
            vencord-installer-cli-macos-arm64 \
            --target "$GITHUB_SHA" \
            --title "Latest BetterStatus build" \
            --notes "Automated production build from commit $GITHUB_SHA. This rolling release is replaced after every push to prod." \
            --latest
