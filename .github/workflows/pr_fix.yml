name: Keep files.json from dev

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync-files-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Get dev
        run: git fetch origin dev

      - name: Replace files.json with dev version
        run: |
          git checkout origin/dev -- files.json

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "files.json already matches dev"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add files.json
          git commit -m "chore: sync files.json from dev"
          git push origin HEAD:${{ github.head_ref }}
